set -g default-terminal "tmux-256color"
set -g escape-time 300
set -g status 2
set -g status-interval 1
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] "
set -g status-left-length 20
set -g status-right-length 120
set -g status-right "#[fg=#89b4fa]#{bluetooth_icon}#[default] #{bluetooth} #[fg=#a6adc8]| #{bluetooth_count} | low #{bluetooth_min} "
set -g window-status-format ""
set -g window-status-current-format ""
set -g @revamped_screen_keys ""
set -g status-format[1] "#[align=centre]#{?#{@revamped_screen_keys},#[fg=#1e1e2e#,bg=#f9e2af#,bold] #{@revamped_screen_keys} ,}"
bind -n C-] command-prompt -p "" "set -g @revamped_screen_keys '%%'"
run-shell 'tmux set-environment -g PATH "/Users/Shared/demo/bin:$PATH"'
run-shell 'PATH="/Users/Shared/demo/bin:$PATH" "$SCREENS_REPO/bluetooth-revamped.tmux"'
